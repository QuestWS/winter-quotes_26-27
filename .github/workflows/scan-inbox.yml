name: Scan inbox

# Reads chris@questwatersports.com over IMAP every morning and adds anything
# that looks like an unlogged payment, change or request to the Inbox Review
# tab of the spreadsheet. Read-only on the mailbox; adds rows to one tab and
# touches no quote. Detail: docs/ref/EMAILS.md, "The Inbox Review tab".
#
# THIS REPO IS PUBLIC, AND SO ARE THESE LOGS. tools/inbox-scan.py prints
# counts only. Never add a step that echoes a message, an address or a name.
#
# Needs three repository secrets: IMAP_USER, IMAP_PASSWORD, INBOX_SCAN_KEY.
# The AI review needs one more: CLAUDE_CODE_OAUTH_TOKEN (Chris's Claude
# subscription, from `claude setup-token`) or ANTHROPIC_API_KEY (pay as you
# go). Neither: keyword matching only.
# Optional variables: IMAP_HOST, IMAP_PORT, IMAP_FOLDERS,
# INBOX_SCREEN_MODEL (default claude-haiku-5-5), INBOX_REVIEW_MODEL (claude-opus-5-5).

on:
  schedule:
    # GitHub schedules in UTC only. 12:10 UTC is 6:10am Central in winter
    # (CST) and 7:10am in summer (CDT): either way the tab is filled before
    # the 8am start. Off the hour on purpose -- GitHub delays runs queued at
    # :00 at busy times. Any time, Actions -> Scan inbox -> Run workflow.
    - cron: '10 12 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to scan (the server keeps about two weeks; 30 reads all of it)'
        required: true
        default: '3'
        type: string

concurrency:
  group: inbox-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # a full catch-up with the AI review takes a while
    steps:
      - uses: actions/checkout@v4

      - name: Check required configuration
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          INBOX_SCAN_KEY: ${{ secrets.INBOX_SCAN_KEY }}
        run: |
          missing=0
          [ -n "$IMAP_USER" ]      || { echo "::error::Missing secret IMAP_USER (the mailbox login, e.g. chris@questwatersports.com)"; missing=1; }
          [ -n "$IMAP_PASSWORD" ]  || { echo "::error::Missing secret IMAP_PASSWORD"; missing=1; }
          [ -n "$INBOX_SCAN_KEY" ] || { echo "::error::Missing secret INBOX_SCAN_KEY — run setupInboxScan() in the Apps Script editor and copy the key it prints"; missing=1; }
          exit $missing

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Anthropic SDK and pypdf
        run: pip install --quiet anthropic pypdf

      # Only when the subscription token is set: the scanner then reaches
      # Claude through the Claude Code CLI rather than the SDK.
      - name: Install Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then npm install --global --silent @anthropic-ai/claude-code; fi

      - name: Scan and post to the Inbox Review tab
        env:
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          IMAP_PORT: ${{ vars.IMAP_PORT }}
          IMAP_FOLDERS: ${{ vars.IMAP_FOLDERS }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          INBOX_SCAN_KEY: ${{ secrets.INBOX_SCAN_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INBOX_SCREEN_MODEL: ${{ vars.INBOX_SCREEN_MODEL }}
          INBOX_REVIEW_MODEL: ${{ vars.INBOX_REVIEW_MODEL }}
          SCAN_DAYS: ${{ inputs.days || '3' }}
        run: python3 tools/inbox-scan.py
