<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Your Storage Agreement — Quest Watersports</title>
<!-- A laminated QR at the service counter is the only thing that should ever
     send somebody here. It is not a landing page, it has no content of its
     own, and a search result for it would only ever confuse. -->
<meta name="robots" content="noindex, nofollow">
<!-- One Quest mark for the whole site: favicon.png at the repo root.
     Every page links the same file, so it cannot drift between pages and
     the browser downloads it once for all of them. -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<!-- The shared Quest palette, type scale and control shapes. This page links
     them rather than re-typing them, which is the whole point of quest.css. -->
<link rel="stylesheet" href="quest.css">
<style>
/* Everything below is specific to this one page. Anything another Quest page
   would also want belongs in quest.css instead. */
.wrap{max-width:560px;margin:0 auto;padding:22px 20px 0}
@media(max-width:640px){.wrap{padding:16px 0 0}}

.field{margin-bottom:18px}
/* A quote number is a reference, not prose — same monospace the quote page and
   the sheet use for numbers, and big enough to proofread at arm's length in a
   busy shop. 17px also keeps iOS from zooming the viewport on focus. */
#quote{font-family:var(--mono);font-size:19px;letter-spacing:.06em;padding:13px 12px;
  text-transform:uppercase}
#slip{font-size:17px;padding:13px 12px}
.hint{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}

/* The lookup answer. Hidden until there is something to say, so the page does
   not reserve a visibly empty box for a result that may never come. */
#found{display:none;margin-top:10px}
#found.show{display:block}
#found .who{font-weight:700}
#found .unit{font-family:var(--mono);font-size:13.5px;letter-spacing:.02em}

.actions{margin-top:22px}
.skip{margin-top:4px}

/* The escape hatch is deliberately quiet but deliberately REACHABLE: somebody
   standing at the counter without their paperwork must never be stuck, so it
   is a real link with a real tap target, not a footnote. */
.skip a{display:block;text-align:center;color:var(--frost);font-size:15px;
  padding:14px 10px;text-decoration:underline}
.skip a:hover{color:var(--navy)}
</style>
</head>
<body>

<header class="site">
  <div class="site-inner">
    <div class="brand"><img src="Quest%20wet%20rect.png" alt="Quest Watersports"></div>
    <div class="season">Winter Storage Agreement</div>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h1>Sign your storage agreement</h1>
    <p class="lead">Enter your quote number and we'll open your agreement with it
      already filled in. It takes about a minute.</p>

    <div class="field">
      <label class="f" for="quote">Quote number</label>
      <input id="quote" type="text" inputmode="numeric" autocomplete="off"
             autocorrect="off" autocapitalize="characters" spellcheck="false"
             enterkeyhint="go" placeholder="1255" aria-describedby="quoteHint" autofocus>
      <div class="hint" id="quoteHint">It's on your quote — the last four digits are enough.</div>
      <div id="found" class="msg" role="status" aria-live="polite"></div>
    </div>

    <div class="field">
      <label class="f" for="slip">Slip number <small>— optional, only if you keep a slip</small></label>
      <input id="slip" type="text" inputmode="text" autocomplete="off"
             autocorrect="off" autocapitalize="characters" spellcheck="false"
             enterkeyhint="go" placeholder="B-14">
    </div>

    <div class="actions">
      <button class="btn" id="go" type="button">Continue to the agreement</button>
      <div class="skip"><a id="skip" href="#">I don't have my quote number</a></div>
    </div>
  </div>
</div>

<footer class="site">
  Questions? Call us at <a href="tel:+18154332200">(815)&nbsp;433-2200</a>.<br>
  <a href="terms.html">Terms</a> &middot; <a href="privacy.html">Privacy</a>
</footer>

<!-- The shared rule set. SIGNING (the web form URL and the two Adobe field
     names), signUrlFor() and normalizeQuoteNo() all come from here, so this
     page holds no copy of any of them. -->
<script src="pricing-engine.js"></script>
<script>
/* ============================================================================
   SCAN TO SIGN — the interstitial between a QR code and the Adobe contract.
   ----------------------------------------------------------------------------
   WHAT THIS PAGE IS FOR. The QR on the counter flyer used to point straight at
   Acrobat Sign, so the customer typed their quote number into the agreement
   itself — into a field nobody checks until the contract comes back wrong.
   This page moves that typing one step earlier, where we can check it against
   the sheet and where a mistake costs nothing.

   THE RULE THAT SHAPES EVERYTHING HERE: the lookup may inform, it may never
   block. A customer standing at the counter must reach the contract whatever
   the network, the spreadsheet or Apps Script are doing — an unknown number,
   a timeout and a dead backend all end the same way, with a soft warning and a
   working Continue button. Nothing on this page returns early on a failure.

   WHY THERE IS NO ADOBE URL IN THIS FILE. SIGNING.webFormUrl and the two field
   names live in pricing-engine.js, shared with the quote page and the Apps
   Script, because the form URL changes every time the agreement is re-published
   and three copies of it would mean two stale ones. tools/check-sign-link.js
   fails the build if this page grows its own.
============================================================================ */

/* The one URL everything shares — CLAUDE.md §1. Same /exec as index.html and
   admin/index.html; tools/verify.sh fails if these ever disagree. */
var API_URL = 'https://script.google.com/macros/s/AKfycbxv8kqGKXU_4-9TytfWzdrv-QqqmyrYLxRwd8FDfA8b47sX3NlEBNDlIwIHRuQObZbL9w/exec';

/* Fail open after this long. Chosen from where the customer is standing: past
   about three seconds at a counter the page reads as broken, and a confirmation
   we cannot fetch is worth less than a customer who keeps moving. */
var LOOKUP_TIMEOUT_MS = 3500;

var E = window.QuestPricing || {};
var $ = function (id) { return document.getElementById(id); };
var qEl = $('quote'), slipEl = $('slip'), foundEl = $('found'), goEl = $('go');

/* Set once the customer types in the slip box themselves. A slip that came
   back from the sheet is a suggestion; one they typed is an answer, and a
   later lookup must never overwrite it. */
var slipTouched = false;
/* The last quote number we actually asked about, so re-blurring an unchanged
   field does not re-ask. */
var askedFor = '';
var lookupSeq = 0;   // only the newest lookup may paint

/* ---- the confirmation line -------------------------------------------- */
function say(kind, html) {
  foundEl.className = 'msg ' + kind + ' show';
  foundEl.innerHTML = html;
}
function clearSay() { foundEl.className = 'msg'; foundEl.innerHTML = ''; }

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ---- normalising what they typed --------------------------------------
   The normalized number goes straight back into the input. It is written into
   a field the customer cannot edit on the Adobe side, so the one defence
   against a wrong guess is that they can see it before they send it. */
function normalized() {
  return E.normalizeQuoteNo ? E.normalizeQuoteNo(qEl.value) : String(qEl.value || '').trim().toUpperCase();
}
function normalizeField() {
  var n = normalized();
  if (n && qEl.value !== n) qEl.value = n;
  return n;
}

/* ---- the lookup --------------------------------------------------------
   fetch first, JSONP second, silence third. The quote page settled on the same
   two-transport shape for the same reason: Apps Script answers a cross-origin
   GET differently depending on how the request got there, and a customer does
   not care which one worked. */
function lookup(qn) {
  if (!qn || qn === askedFor) return;
  askedFor = qn;
  var seq = ++lookupSeq;
  var settled = false;
  var timer = setTimeout(function () { finish(null); }, LOOKUP_TIMEOUT_MS);

  function finish(res) {
    if (settled || seq !== lookupSeq) return;
    settled = true;
    clearTimeout(timer);
    paint(res, qn);
  }

  var url = API_URL + '?action=signlookup&quote=' + encodeURIComponent(qn) + '&t=' + Date.now();
  try {
    fetch(url, { method: 'GET', redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(finish)
      .catch(function () { jsonp(url, finish); });
  } catch (e) {
    jsonp(url, finish);
  }
}

/* The JSONP fallback, as on the quote page: a <script> tag is not subject to
   CORS, which is what makes it useful when the fetch above is refused. The
   callback is torn down either way so a late answer cannot paint over a newer
   one. */
var jsonpSeq = 0;
function jsonp(url, done) {
  var name = '__qwSign' + (++jsonpSeq);
  var sc = document.createElement('script');
  var cleanup = function () {
    try { delete window[name]; } catch (e) { window[name] = undefined; }
    if (sc.parentNode) sc.parentNode.removeChild(sc);
  };
  window[name] = function (res) { cleanup(); done(res); };
  sc.onerror = function () { cleanup(); done(null); };
  sc.src = url + '&callback=' + name;
  document.body.appendChild(sc);
}

/* What the customer is told. Three outcomes, one of which is deliberately
   quiet: when the backend never answered we say nothing at all rather than
   claim their quote does not exist — it may well, and a false "we can't find
   it" at the counter starts a conversation that did not need to happen. */
function paint(res, qn) {
  if (!res) { clearSay(); return; }                       // lookup unavailable
  if (!res.ok) {
    say('warn', "We couldn't find quote <b>" + esc(qn) + "</b> — double-check the number, " +
                "or continue and we'll sort it out at the counter.");
    return;
  }
  var bits = [];
  if (res.who) bits.push('<span class="who">' + esc(res.who) + '</span>');
  if (res.unit) bits.push('<span class="unit">' + esc(res.unit) + '</span>');
  say('ok', 'Found your quote' + (bits.length ? ' — ' + bits.join(' &middot; ') : '') + '.');
  /* A slip we know about is offered, never imposed: if they have already typed
     one, theirs wins. */
  if (res.slip && !slipTouched && !slipEl.value) slipEl.value = res.slip;
}

/* ---- the hand-off ------------------------------------------------------ */
function signUrl(qn) {
  if (E.signUrlFor && qn) {
    var u = E.signUrlFor({ quoteNo: qn, slipNo: slipEl.value });
    if (u) return u;
  }
  return bareForm();
}
/* The escape hatch, and the fallback for a quote number we could not make
   sense of: the form with nothing filled in. Better a blank agreement the
   customer completes at the counter than a dead button. */
function bareForm() {
  return (E.SIGNING && E.SIGNING.webFormUrl) ? String(E.SIGNING.webFormUrl).split('#')[0] : '';
}

/* Same tab, on purpose. Nearly everyone here is on a phone, and a new tab
   leaves them with a back button that goes nowhere. */
function leaveFor(url) {
  if (!url) {
    say('warn', 'Signing is not available right now — please see us at the counter ' +
                'or call (815) 433-2200.');
    return;
  }
  window.location.href = url;
}

function go() {
  var qn = normalizeField();
  if (!qn) {
    qEl.className = 'fieldbad';
    say('warn', "That doesn't look like a quote number — it's the four digits on your quote, " +
                "like <b>1255</b>. Or continue without it and we'll fill it in at the counter.");
    qEl.focus();
    return;
  }
  qEl.className = '';
  goEl.disabled = true;
  leaveFor(signUrl(qn));
}

/* ---- wiring ------------------------------------------------------------ */
qEl.addEventListener('blur', function () { lookup(normalizeField()); });
/* Debounced as they type, so a customer who pauses gets their confirmation
   without having to leave the field — most of them tap Continue straight from
   the keyboard and never blur it at all. */
var typeTimer = null;
qEl.addEventListener('input', function () {
  qEl.className = '';
  clearSay();
  askedFor = '';
  clearTimeout(typeTimer);
  typeTimer = setTimeout(function () { lookup(normalized()); }, 600);
});
slipEl.addEventListener('input', function () { slipTouched = true; });
goEl.addEventListener('click', go);
$('skip').addEventListener('click', function (ev) { ev.preventDefault(); leaveFor(bareForm()); });
[qEl, slipEl].forEach(function (el) {
  el.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); go(); } });
});

/* ---- deep link ---------------------------------------------------------
   ?quote=1255&slip=B-14 fills the page in, so a customer-specific link can be
   emailed alongside a quote later without building anything new. It does NOT
   auto-continue: the confirmation step is the entire point, and a link that
   threw somebody straight into a contract would skip it. */
(function deepLink() {
  var q = new URLSearchParams(window.location.search);
  var dq = String(q.get('quote') || '').trim();
  var ds = String(q.get('slip') || '').trim();
  if (ds) { slipEl.value = ds; slipTouched = true; }
  if (dq) {
    qEl.value = dq;
    var n = normalizeField();
    if (n) lookup(n);
  }
  /* They just scanned a code; the keyboard should already be up. iOS ignores
     the autofocus attribute, so ask again once the page is interactive — and
     only when there is actually something for them to type. */
  if (!dq) { try { qEl.focus(); } catch (e) {} }
})();
</script>
</body>
</html>
